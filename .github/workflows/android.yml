name: Build Android APK

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and unit tests
        run: |
          npx tsc --noEmit
          npm test

      - name: Generate native Android project
        run: npx expo prebuild -p android --no-install

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/masik-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: masik-apk
          path: out/*.apk

      - name: Publish as GitHub release (easy download link for the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: המסיק – גרסה ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          files: out/*.apk
          body: |
            להתקנה: פותחים את הקישור בטלפון, מורידים את קובץ ה-APK ולוחצים עליו.
            בפעם הראשונה אנדרואיד יבקש לאשר "התקנה ממקורות לא ידועים".
            עדכון לגרסה חדשה שומר את כל הנתונים.
