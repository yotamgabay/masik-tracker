name: Build Android APK

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Lint, typecheck and unit tests
        run: |
          npm run lint
          npx tsc --noEmit
          npm test

      - name: Generate native Android project
        run: npx expo prebuild -p android --no-install

      # אותו מפתח חתימה תמיד – אחרת אנדרואיד לא יאפשר לעדכן בלי למחוק את האפליקציה (והנתונים)
      - name: Use the pinned signing key
        run: cp signing/masik-signing.keystore android/app/debug.keystore

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon

      - name: Verify the APK is signed with the same key as before
        env:
          EXPECTED_CERT_SHA256: FA:C6:17:45:DC:09:03:78:6F:B9:ED:E6:2A:96:2B:39:9F:73:48:F0:BB:6F:89:9B:83:32:66:75:91:03:3B:9C
        run: |
          python3 -I signing/apk_cert_sha256.py android/app/build/outputs/apk/release/app-release.apk | tee cert.txt
          grep -q "SHA256: $EXPECTED_CERT_SHA256" cert.txt || { echo "::error::APK signing key changed - updating would require uninstalling and lose data"; exit 1; }

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/masik-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: masik-apk
          path: out/*.apk

      # דורש: Settings → Actions → General → Workflow permissions → Read and write.
      # אם אין הרשאה, ה-APK עדיין זמין להורדה כ-artifact של ההרצה.
      - name: Publish as GitHub release (easy download link for the phone)
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: המסיק – גרסה ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          files: out/*.apk
          body: |
            להתקנה: פותחים את הקישור בטלפון, מורידים את קובץ ה-APK ולוחצים עליו.
            בפעם הראשונה אנדרואיד יבקש לאשר "התקנה ממקורות לא ידועים".
            עדכון לגרסה חדשה שומר את כל הנתונים.
